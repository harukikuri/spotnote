# Push a tag like v0.2.0 → test, publish spotnote and spotnote-mcp to npm, and
# create the GitHub release. Bump both package.json versions to match first.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing (no token) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11 # trusted publishing needs npm 11.5.1 or later
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in plugin mcp; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "::error::$p/package.json is $v, tag is v$tag"; exit 1; }
          done

      # Trusted publishing: npmjs.com trusts this workflow (each package's
      # Settings → Trusted Publisher), so no token. A version already on npm is
      # skipped, so a re-run after a partial failure finishes the rest.
      - name: Publish to npm
        run: |
          for p in plugin mcp; do
            name=$(node -p "require('./$p/package.json').name")
            if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
              echo "$name@${GITHUB_REF_NAME#v} is already published"
            else
              (cd "$p" && npm publish --provenance --access public)
            fi
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
