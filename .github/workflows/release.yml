# Push a tag like v0.2.0 → CI, Test and E2E (side by side), then, only if both pass,
# publish spotnote and spotnote-mcp to npm and create the GitHub release. Bump
# both package.json versions to match first.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit # CODECOV_TOKEN, for its Codecov uploads
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit # CODECOV_TOKEN, for its Codecov uploads

  release:
    needs: [ci, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing (no token) and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags and commits, for the release notes

      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11 # trusted publishing needs npm 11.5.1 or later
      - run: pnpm install --frozen-lockfile

      - name: Tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in package mcp; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "::error::$p/package.json is $v, tag is v$tag"; exit 1; }
          done

      # Trusted publishing: npmjs.com trusts this workflow (each package's
      # Settings → Trusted Publisher), so no token. A version already on npm is
      # skipped, so a re-run after a partial failure finishes the rest.
      # Each package is built (TypeScript → dist/) and packed by pnpm, which
      # swaps in its publishConfig (bin, exports… pointing at dist/), then that
      # tarball is published.
      - name: Publish to npm
        run: |
          for p in package mcp; do
            name=$(node -p "require('./$p/package.json').name")
            if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
              echo "$name@${GITHUB_REF_NAME#v} is already published"
            else
              out="$RUNNER_TEMP/pack-$p"
              (cd "$p" && pnpm run --if-present build && pnpm pack --pack-destination "$out")
              npm publish "$out"/*.tgz --provenance --access public
            fi
          done

      # Notes from the commits since the last tag: feat:, fix: and perf: ones,
      # grouped (changelogithub). It updates the release if it exists, so a re-run
      # replaces notes edited by hand.
      - name: GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec changelogithub
