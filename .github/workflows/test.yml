# Every push to main, every pull request and every release: the unit tests, and the browser
# tests against each example app.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # from release.yml, before publishing

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage # the tests, with a coverage report in the log

      - uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter spotnote-e2e exec playwright install --with-deps chromium
      - run: pnpm coverage:e2e # the browser tests, with a coverage report of the client in the log

      - uses: codecov/codecov-action@v5
        with:
          files: e2e/coverage/lcov.info
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
