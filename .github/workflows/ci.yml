# Every push to main, every pull request and every release: format and lint (Biome)
# (and, for a release, that npm's README is up to date), the docs
# site's production build and a build of each example app. The tests are in
# test.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # from release.yml, before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck # tsc on the TypeScript packages

      # On a release tag only: npm's README (package/README.md) must be the root
      # README's copy. Not on every push, since the README is edited on GitHub
      # too; the release steps make the copy (node scripts/readme.mjs).
      - name: npm's README is up to date
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/readme.mjs --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # What npm gets: each package built and packed as the release does.
      - name: Packages build
        run: |
          for p in package mcp; do
            (cd "$p" && pnpm run --if-present build && pnpm pack --pack-destination "$RUNNER_TEMP/pack-$p")
          done
          tar -tzf "$RUNNER_TEMP"/pack-mcp/*.tgz | grep -q package/dist/cli.js

      - name: Docs build
        run: pnpm --filter @spotnote/docs build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Example apps
        run: |
          node examples/sync.mjs --check # the copies of each framework's app are up to date
          pnpm --filter "./examples/**" run build