# Every push to main, every pull request and every release: format and lint (Biome), the docs
# site's production build and a build of each example app. The tests are in
# test.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # from release.yml, before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Docs build
        run: pnpm --filter @spotnote/docs build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Example apps
        run: |
          node examples/sync.mjs --check # the copies of each framework's app are up to date
          pnpm --filter "./examples/**" run build