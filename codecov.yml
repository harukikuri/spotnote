# Coverage from two runs, merged: the unit tests (flag "unit": the Node side)
# and the browser tests (flag "e2e": the browser client, and spotnote-mcp as the
# agent uses it). Its checks only report; they never fail a commit or PR.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
codecov:
  notify:
    # Wait for both uploads (unit and e2e): a run cancelled halfway (a newer push)
    # would otherwise report one flag's partial coverage as the commit's.
    after_n_builds: 2
